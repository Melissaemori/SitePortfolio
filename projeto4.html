<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="projeto4.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos</title>
</head>


<body>
      <section class="hero-section" id="hero">
        <div class="video-background">
            <video autoplay muted loop id="bgVideo">
                <source src="https://cdn.pixabay.com/video/2025/10/22/311442_large.mp4" type="video/mp4">
            </video>
        </div>

        <div class="hero-content">
            <h1>O Futuro começa agora.</h1>
            <p>Transforme sua visão em realidade com nossas soluções inovadoras.</p>
 
            <a href="#videos" class="cta-button"> Descubra Mais</a>
        </div>
    </section>


    <section class="videos-section" id="videos">
        <h2>Nossos Destaques</h2>
        <div class="video-gallery">

            <div class="video-frame" data-video-url="https://pixabay.com/pt/videos/download/video-137614_medium.mp4">
                <img src="https://cdn.pixabay.com/photo/2024/05/20/16/50/landscape-8775773_640.jpg" alt="">
                <div class="overlay">Clique para assistir</div>
            </div>


            <div class="video-frame" data-video-url="https://pixabay.com/pt/videos/download/video-137614_medium.mp4">
                <img src="https://cdn.pixabay.com/photo/2025/11/26/06/44/pop-up-9977611_640.jpg" alt="">
                <div class="overlay">Clique para assistir</div>
            </div>


            <div class="video-frame" data-video-url="https://cdn.pixabay.com/video/2024/10/17/236711_large.mp4">
                <img src="https://cdn.pixabay.com/photo/2025/10/13/10/31/deer-9891816_1280.jpg" alt="">
                <div class="overlay">Clique para assistir</div>
            </div>


            </div>
    </section>


    <section class="map-section" id="mapa">
        <h2>Onde estamos</h2>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d33815.53069341667!2d-46.68358922440406!3d-23.51191207948723!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cef8399ce79a45%3A0x4e55db5c8ddf8991!2sR.%20Campos%20do%20Cajuru%20-%20Vila%20Palmeiras%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2002726-100!5e0!3m2!1spt-BR!2sbr!4v1765580935695!5m2!1spt-BR!2sbr" width="800" height="600" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
     
    <div class="video-it">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/SEa7ata9wBI?si=oCCSbqIMsEK7ZAVw&amp;start=11" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

<!-- Modal para Reprodução de Vídeo -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <!-- O iframe do vídeo será injetado aqui pelo JavaScript -->
            <iframe id="modalVideoFrame" width="100%" height="100%" src="" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            
        </div>
    </div>

    <script src="script.js"></script>



</body>
</html>
